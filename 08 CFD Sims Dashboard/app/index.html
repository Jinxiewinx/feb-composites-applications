<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#00294d">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f16">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>FEB CFD</title>
<script>
  /* Set the theme before first paint (no flash): saved choice, else system.
     Same mechanism as the composites app, its own keys. */
  (function(){try{var t=localStorage.getItem('cfd-theme');if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('cfd-rail')==='1'){document.documentElement.classList.add('rail');}}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<!-- The design system, copied byte for byte from 05 Design System/ (a test
     checks). The viewer keeps its own dark tokens under .viewer in styles.css,
     so the theme toggle never reaches the page canvas. -->
<link rel="preload" href="ds/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="ds/fonts/saira-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="content">
    <header class="topbar" id="topbar"></header>
    <main id="main"></main>
  </div>
</div>

<div id="lightbox-root"></div>
<div id="drop" class="drop"><div class="drop-inner">Drop CFD reports to open</div></div>
<div id="toasts"></div>
<input type="file" id="filepick" accept="application/pdf,.pdf" multiple hidden>

<script src="firebase-config.js"></script>
<script type="module" src="core.js"></script>
</body>
</html>
