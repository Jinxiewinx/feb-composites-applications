<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#002b50">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f16">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Composites">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/saira-var.woff2" as="font" type="font/woff2" crossorigin>
<title>FEB Composites</title>
<script>
  /* Set the theme before first paint (no flash): saved choice, else system. */
  (function(){try{var t=localStorage.getItem('feb-theme');if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('feb-rail')==='1'){document.documentElement.classList.add('rail');}}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<style>
  /* Self-hosted so the app keeps its type offline at the field station. Both
     are variable fonts (one file each covers every weight). */
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('fonts/inter-var.woff2') format('woff2'); }
  @font-face { font-family: 'Saira'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('fonts/saira-var.woff2') format('woff2'); }

  /* ---- design tokens ----
     Old names (--blue --canvas --card --line --ink --muted --faint --bad --ok
     --amber --accent --accent-soft --radius --shadow) are kept as aliases so
     every existing component themes for free; the dark block below just
     re-points the shared tokens. New names (--surface-2 --hover --fill, status
     -bg/-border, --shadow-md, motion, fonts) drive the revamp. */
  :root {
    color-scheme: light;
    /* brand */
    --blue: #003262; --navy-2: #024a86; --brand-blue: #2f6be4; --brand-ink: #003a75;
    --gold: #FDB515; --gold-2: #ffc63d;
    --sb-bg: #002b50; --sb-text: #c4d0e0; --sb-hover: rgba(255,255,255,.09); --sb-active: rgba(253,181,21,.18);
    /* surfaces */
    --canvas: #eef1f6; --card: #ffffff; --surface: #ffffff;
    --surface-2: #f4f7fb; --fill: #eef1f6; --hover: #f2f5fa;
    --line: #dde3ec; --border-2: #c6d0de;
    /* text */
    --ink: #141d2b; --muted: #515f74; --faint: #616e83;
    /* interactive + status */
    --accent: #2f6be4; --accent-soft: #e8f0fd;
    --ok: #0d7a55; --ok-bg: #e2f6ee; --ok-border: #a8e6cc;
    --amber: #a25c00; --warn-bg: #fdf1d8; --warn-border: #f0d081;
    --bad: #cf3430; --bad-bg: #fdeceb; --bad-border: #f4bbb6;
    --retro: #5a45b0; --retro-bg: #ece8fb; --retro-border: #c7bcf0;
    --purple: #6a3fb0; --purple-bg: #efe7fb; --purple-border: #d3c0f0;
    --info-bg: #e8f0fd; --gold-bg: #fff7e0;
    /* effects */
    --radius: 6px; --r-md: 9px; --r-lg: 14px;
    --shadow: 0 1px 2px rgba(10,22,40,.06), 0 1px 3px rgba(10,22,40,.09);
    --shadow-md: 0 2px 6px rgba(10,22,40,.07), 0 8px 22px rgba(10,22,40,.10);
    --shadow-lg: 0 18px 44px rgba(10,22,40,.20);
    --carbon: rgba(255,255,255,.04);
    /* motion + type */
    --t: .17s; --t-fast: .12s; --ease: cubic-bezier(.2,.6,.2,1);
    --font: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: 'Saira', 'Inter', system-ui, sans-serif;
    /* safe areas — the notch, the Dynamic Island, the home indicator.
       The meta viewport sets `viewport-fit=cover` and the PWA runs standalone
       with a translucent status bar, all three on purpose: that is what lets
       the navy topbar meet the island like a native app instead of sitting
       below a white letterbox. The price is that EVERY element at a screen
       edge owns its own inset, and for a long time only two did.

       Wrapping env() in a custom property is not decoration. env() cannot be
       faked in a headless browser, but a variable holding it CAN be overridden
       by an injected stylesheet — which is the whole reason
       tools/test_safearea.mjs can measure a simulated iPhone instead of
       grepping this file for the string "env(". Use these, not env() directly. */
    --sa-t: env(safe-area-inset-top, 0px);
    --sa-r: env(safe-area-inset-right, 0px);
    --sa-b: env(safe-area-inset-bottom, 0px);
    --sa-l: env(safe-area-inset-left, 0px);
    /* Measured from the real topbar by syncChromeMetrics() in core.js: its
       height depends on --sa-t, and everything sticky below it has to clear
       whatever that came out as. The fallback is the old hardcoded number, so
       a render before the JS runs is no worse than it used to be. */
    --topbar-h: 52px;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --navy-2: #2a6bb5; --sb-bg: #071a30; --brand-ink: #6f9dff;
    --canvas: #0b0f16; --card: #141c28; --surface: #141c28;
    --surface-2: #1a2431; --fill: #1a2431; --hover: #212d3d;
    --line: #26313f; --border-2: #37455c;
    --ink: #e7edf5; --muted: #9aa8bd; --faint: #8794a8;
    --accent: #5b8cff; --accent-soft: #182842;
    --ok: #34c88f; --ok-bg: #0f2a20; --ok-border: #1f4d3b;
    --amber: #e0a53a; --warn-bg: #2a2211; --warn-border: #4a3d1c;
    --bad: #ff6f62; --bad-bg: #2c1613; --bad-border: #56291f;
    --retro: #a99bf0; --retro-bg: #1d1935; --retro-border: #3a3168;
    --purple: #a385e6; --purple-bg: #241c3a; --purple-border: #3d2f5c;
    --info-bg: #182842; --gold-bg: #2a2411;
    --shadow: 0 1px 2px rgba(0,0,0,.5); --shadow-md: 0 4px 18px rgba(0,0,0,.55); --shadow-lg: 0 18px 44px rgba(0,0,0,.6);
    --carbon: rgba(255,255,255,.03);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 14px/1.5 var(--font); background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  button { font: inherit; font-weight: 500; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 7px 12px; cursor: pointer; color: var(--ink);
    transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
  button:hover { background: var(--hover); border-color: var(--border-2); }
  button:active { transform: translateY(.5px); }
  button.primary { background: var(--blue); border-color: var(--brand-ink); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--navy-2); border-color: var(--navy-2); }
  button.gold { background: var(--gold); border-color: var(--gold); color: #3a2c00; font-weight: 700; }
  button.gold:hover { background: var(--gold-2); border-color: var(--gold-2); }
  button.danger { color: var(--bad); }
  button.danger:hover { background: var(--bad-bg); border-color: var(--bad-border); }
  button.link { border: none; background: none; color: var(--accent); padding: 4px 6px; }
  button.link:hover { background: none; text-decoration: underline; }
  /* `.btn` and `.sm` were written 13 times across weeklyplan/people/projects and
     never defined, so every "small" button rendered full size. `.btn` carries
     the base button look for real (it's a no-op on a <button>, but now also
     works if it's ever put on an <a>), and `.sm` finally makes a button small. */
  .btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-weight: 500;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
    padding: 7px 12px; cursor: pointer; color: var(--ink); text-decoration: none; }
  /* No min-height override — the @media (pointer: coarse) block below still has
     to be able to grow these to a 40px tap target on a tablet at the bench. */
  .sm { padding: 4px 9px; font-size: 12.5px; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  :focus:not(:focus-visible) { outline: none; }
  ::selection { background: var(--accent); color: #fff; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }

  /* ---- app shell: sidebar + content ---- */
  #app { display: flex; min-height: 100vh; }
  nav.sidebar { width: 216px; flex: 0 0 216px; color: var(--sb-text); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
    padding-left: var(--sa-l);
    background-color: var(--sb-bg);
    background-image: repeating-linear-gradient(45deg, var(--carbon) 0 1px, transparent 1px 7px), repeating-linear-gradient(-45deg, var(--carbon) 0 1px, transparent 1px 7px); }
  nav.sidebar:empty { display: none; }
  .sb-brand { display: flex; align-items: center; gap: 9px; padding: 15px 14px 12px; cursor: pointer; }
  .sb-brand-txt { font-weight: 700; font-size: 15px; color: #fff; letter-spacing: .2px; }
  .sb-brand-txt span { color: var(--gold); }
  .feb-mark { flex: none; }
  .ico { display: inline-block; vertical-align: middle; flex: none; }
  .sb-nav { display: flex; flex-direction: column; padding: 6px 8px; gap: 2px; flex: 1; }
  .sb-item { position: relative; display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 7px; color: var(--sb-text); cursor: pointer; font-size: 13.5px; font-weight: 500; border: none; background: none; text-align: left; width: 100%; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .sb-item:hover { background: var(--sb-hover); color: #fff; }
  .sb-item.active { background: var(--sb-active); color: #fff; font-weight: 600; }
  /* gold "speed slash" marking the active tab. Sits INSIDE .sb-item's own box
     (left:2px, not a negative offset into the parent's padding) on purpose:
     nav.sidebar becomes an overflow:auto clipping container on mobile (see the
     responsive block below), and a marker positioned outside its own item's
     box — plus the extra reach from the skew transform — got silently clipped
     there even though it rendered fine on desktop where nothing clips. */
  .sb-item.active::before { content: ""; position: absolute; left: 2px; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0; background: var(--gold); transform: skewX(-12deg); }
  .sb-item .ic { display: inline-flex; align-items: center; justify-content: center; width: 20px; opacity: .9; }
  .sb-item .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
  /* The rail: the sidebar collapsed to icons, hands 160px back to the content.
     A class on <body> rather than on the nav, because main's width is what
     actually changes and the two have no ancestor in common below #app.
     Everything here is width and visibility only — the navy, the carbon
     crosshatch and the gold speed slash are the app's signature surface and
     survive the collapse intact, which is the point of collapsing rather than
     hiding. Labels move to `title`, set in renderSidebar().
     Only above 900px: below that the sidebar is already a drawer that is not
     on screen at all, so there is nothing to reclaim and a second collapsed
     state would just be a way to end up with no navigation. */
  .sb-toggle { display: flex; align-items: center; gap: 11px; margin: 0 8px 8px; padding: 9px 11px;
    border: none; background: none; border-radius: 7px; color: var(--sb-text); cursor: pointer;
    font: inherit; font-size: 13.5px; width: calc(100% - 16px); text-align: left;
    transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .sb-toggle:hover { background: var(--sb-hover); color: #fff; }
  .sb-toggle .ic { display: inline-flex; align-items: center; justify-content: center; width: 20px; opacity: .9; }
  html.rail nav.sidebar { width: 56px; flex-basis: 56px; }
  /* .sb-label, not `> :not(.ic)`. The nav labels used to be bare text nodes,
     and CSS cannot select a text node — the rule matched nothing, and the rail
     shrank to 56px with every label still painted, spilling over the content.
     A screenshot caught it; a computed-style probe did not, because
     getComputedStyle on a text node quietly reports the body's. */
  html.rail .sb-brand-txt,
  html.rail .sb-label { display: none; }
  html.rail .sb-brand { justify-content: center; padding: 15px 0 12px; }
  html.rail .sb-item, html.rail .sb-toggle { justify-content: center; padding-left: 0; padding-right: 0; gap: 0; }
  html.rail .sb-nav { padding: 6px 4px; }
  html.rail .sb-toggle { margin: 0 4px 8px; width: calc(100% - 8px); }
  /* The unread pip has no room to sit at the end of a label that isn't there,
     so it rides the icon's top-right corner instead of disappearing. */
  html.rail .sb-item .dot { position: absolute; margin: 0; top: 6px; right: 8px; }
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* The insets live on the BASE rule, not in the ≤900 block where they started:
     a landscape iPhone 15 Pro Max is 932px wide, so it takes the desktop rule —
     and in landscape the island moves to the LEFT, which is why the horizontal
     insets are here too and not just the top one. Additive: a device with no
     island still gets its normal 10px. */
  header.topbar { display: flex; align-items: center; gap: 10px;
    padding: calc(10px + var(--sa-t)) max(20px, var(--sa-r)) 10px max(20px, var(--sa-l));
    background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header.topbar:empty { display: none; }
  header.topbar h1 { font-family: var(--font-display); font-size: 19px; margin: 0 auto 0 0; color: var(--ink); font-weight: 600; letter-spacing: .01em; }
  .topbar .actions { display: flex; align-items: center; gap: 8px; }
  .tb-desktop { display: flex; align-items: center; gap: 8px; }
  /* Hamburger + overflow "⋯" appear only on small screens (see media queries). */
  .hamburger { display: none; border: none; background: none; font-size: 20px; line-height: 1; padding: 6px 8px; cursor: pointer; color: var(--ink); border-radius: var(--radius); }
  .hamburger:hover { background: var(--hover); }
  /* Two classes deep on purpose. The button is `class="icon-btn tb-morebtn"`,
     and a plain `.tb-morebtn { display: none }` ties with `.icon-btn { display:
     inline-flex }` further down — later wins, so the phone overflow menu was
     showing on desktop *as well as* the full action row it exists to replace,
     and pushed the topbar past the viewport around 950px. */
  .icon-btn.tb-morebtn { display: none; }
  /* Set by syncChromeMetrics() when the account row measures wider than the bar
     it lives in — which happens at widths above the ≤900 breakpoint once a
     landscape safe-area inset eats into the edge, and for a lead whose row is
     longest. Same swap the breakpoint does, driven by fit instead of by guess. */
  body.tb-overflow .tb-desktop { display: none; }
  body.tb-overflow .icon-btn.tb-morebtn { display: inline-flex; }
  .menu-actions { display: flex; flex-direction: column; gap: 6px; }
  .menu-actions button { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 11px 12px; }
  .menu-actions button .ico { color: var(--muted); }
  .menu-actions button.danger .ico { color: var(--bad); }
  #drawer-backdrop { display: none; }
  /* 1600, not 1180. On a 1920 monitor the old cap put 1140px of content in a
     1704px space and left 27% of the window empty on every tab; on a 2560 it
     was 47%. Still a cap and not 100%: past about 1600 a table row gets long
     enough that the eye loses which row it is on, which is the thing the
     gutter is actually buying. Tabs that want more than this ask for it by
     class rather than by moving the default. */
  main { max-width: 1600px; width: 100%; margin: 0 auto;
    padding: 18px max(20px, var(--sa-r)) calc(60px + var(--sa-b)) max(20px, var(--sa-l)); }
  /* All responsive rules live in one block at the end of this stylesheet, so
     they reliably override the base rules above regardless of specificity. */

  /* ---- avatars ---- */
  .avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; overflow: hidden; background: var(--muted); color: #fff; font-weight: 600; vertical-align: middle; flex: none; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.init { background: var(--muted); }
  .avatar-btn { border: none; background: none; padding: 0; cursor: pointer; border-radius: 50%; }
  .avatar-stack { display: inline-flex; }
  .avatar-stack .avatar { margin-left: -6px; box-shadow: 0 0 0 2px var(--surface); }
  .avatar-stack .avatar:first-child { margin-left: 0; }

  /* ---- filters / tables (carried from before, restyled) ---- */
  .filters { display: flex; gap: 8px; margin: 6px 0 14px; flex-wrap: wrap; }
  .filters select, .filters input { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  table.list { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; box-shadow: var(--shadow); }
  table.list th { background: var(--surface-2); color: var(--muted); text-align: left; padding: 8px 11px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
  table.list th.sortable { cursor: pointer; user-select: none; }
  table.list th.sortable:hover { color: var(--brand-ink); }
  table.list td { padding: 9px 11px; border-top: 1px solid var(--line); cursor: pointer; vertical-align: middle; }
  table.list tr:hover td { background: var(--hover); }
  /* Was scoped to `table.list .tny`, but 28 call sites use it outside a list
     table (ticket detail, the ⋯ menu, Weekly Plan, Documents rows) where it
     silently did nothing. Global, since that's how it's used. */
  .tny { font-size: 12px; color: var(--muted); }
  table.list.dash td { cursor: default; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 5px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--line); background: var(--fill); color: var(--muted); }
  .pill.Complete { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
  .pill.InWork { background: var(--warn-bg); border-color: var(--warn-border); color: var(--amber); }
  .pill.Draft { background: var(--fill); }
  .pill.OnHold { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad); }
  .pill.retro { background: var(--retro-bg); border-color: var(--retro-border); color: var(--retro); }
  /* "now" — the current week, today, the thing you are standing in. Gold, the
     app's existing language for it. NOT .pill.warn: amber means in-work here,
     and a week being the current one is not a status. */
  .pill.now { background: var(--gold-bg); border-color: var(--gold); color: var(--brand-ink); }
  .stage { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 600;
    background: var(--fill); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .stage.st-0 { background: var(--fill); color: var(--muted); }
  .stage.st-mid { background: var(--warn-bg); border-color: var(--warn-border); color: var(--amber); }
  .stage.st-done { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
  .stage.st-na { background: var(--retro-bg); border-color: var(--retro-border); color: var(--retro); }
  .stagerow { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .stage-bar { width: 64px; height: 5px; border-radius: 999px; background: var(--fill); overflow: hidden; margin-top: 4px; }
  .stage-bar-fill { height: 100%; border-radius: 999px; }
  .stage-bar-fill.st-0 { background: var(--muted); }
  .stage-bar-fill.st-mid { background: var(--amber); }
  .stage-bar-fill.st-done { background: var(--ok); }
  .stagecell { display: inline-block; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 5px; font-size: 12px; background: var(--accent-soft); border: 1px solid var(--accent-soft); color: var(--accent); cursor: pointer; }
  .chip:hover { filter: brightness(.97); }
  .kind { display: inline-block; font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 3px; vertical-align: 1px; text-transform: uppercase; }

  /* ---- tickets: kind badge, colored status, gates, sub-tickets ---- */
  .kindfilter { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .kindfilter span { padding: 6px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--muted); }
  .kindfilter span.on { background: var(--blue); color: #fff; }
  .kindbadge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border-radius: 4px; padding: 2px 7px; vertical-align: 1px; }
  .kindbadge.project { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-soft); }
  .kindbadge.issue { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad-border); }
  .status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 5px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status.todo { background: var(--fill); color: var(--muted); border-color: var(--border-2); } .status.todo .dot { background: var(--faint); }
  .status.inprogress { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); } .status.inprogress .dot { background: var(--accent); }
  .status.collecting { background: var(--purple-bg); color: var(--purple); border-color: var(--purple-border); } .status.collecting .dot { background: var(--purple); }
  .status.onhold { background: var(--warn-bg); color: var(--amber); border-color: var(--warn-border); } .status.onhold .dot { background: var(--amber); }
  .status.done { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); } .status.done .dot { background: var(--ok); }
  .status.cancelled { background: var(--surface-2); color: var(--faint); border-color: var(--line); text-decoration: line-through; } .status.cancelled .dot { background: var(--faint); }
  /* the "large dropdown near the top with colors" — status is directly editable from here, no Edit mode needed */
  .statusdrop { position: relative; display: inline-block; }
  .statusdrop select { appearance: none; font: inherit; font-weight: 700; font-size: 13px; padding: 7px 28px 7px 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border-2); background: var(--fill); color: var(--muted); }
  .statusdrop.todo select { background: var(--fill); color: var(--muted); border-color: var(--border-2); }
  .statusdrop.inprogress select { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }
  .statusdrop.collecting select { background: var(--purple-bg); color: var(--purple); border-color: var(--purple-border); }
  .statusdrop.onhold select { background: var(--warn-bg); color: var(--amber); border-color: var(--warn-border); }
  .statusdrop.done select { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
  .statusdrop.cancelled select { background: var(--surface-2); color: var(--faint); border-color: var(--line); }
  .statusdrop::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: .6; font-size: 10px; }
  .req { color: var(--bad); font-weight: 600; font-size: 10px; text-transform: none; }
  /* A plain-cased aside inside an uppercase label or .card h3. Six copies of
     `style="text-transform:none"` were doing this by hand. */
  .nocaps { text-transform: none; letter-spacing: normal; }
  /* "There is new activity here." Same gold pip the sidebar marks a tab with,
     which is why it is a class and not eight inline declarations. */
  .unread-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold); vertical-align: middle; }
  /* the CS-003 enforcement made visible — same amber blocker language as a Work Order step */
  .gate { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 7px; padding: 10px 12px; margin: 8px 0; }
  .gate .gi { color: var(--amber); font-weight: 900; font-size: 15px; line-height: 1.4; }
  .gate b { color: var(--amber); }
  .gate.blocked { background: var(--bad-bg); border-color: var(--bad-border); } .gate.blocked .gi, .gate.blocked b { color: var(--bad); }
  .subticket { display: flex; align-items: center; gap: 10px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); margin-bottom: 6px; cursor: pointer; }
  .subticket:hover { border-color: var(--border-2); background: var(--hover); }
  .subticket .stt { flex: 1; font-weight: 600; font-size: 13.5px; }
  .linkrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
  .col.col-todo::before { background: var(--faint); }
  .col.col-inprogress::before { background: var(--accent); }
  .col.col-collecting::before { background: var(--purple); }
  .col.col-onhold::before { background: var(--amber); }
  .col.col-done::before { background: var(--ok); }
  .col.col-cancelled::before { background: var(--faint); }

  /* ---- cards / detail ---- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; margin: 0 0 14px; box-shadow: var(--shadow); }
  .card h2 { font-family: var(--font-display); margin: 0 0 6px; font-size: 20px; font-weight: 600; color: var(--ink); letter-spacing: .01em; }
  .card h3 { margin: 16px 0 7px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
  .card h3:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 16px; }
  .grid .f label, .field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .grid .f input, .grid .f select, .field input, .field select { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .grid .f .ro { padding: 5px 0; min-height: 1.5em; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  /* Work-order section jumps. Sticky under the topbar (which is 5) so it stays
     reachable through a long traveler. */
  .jumpbar { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 0 0 12px;
    position: sticky; top: var(--topbar-h); z-index: 4; background: var(--canvas);
    padding: 6px 0; border-bottom: 1px solid var(--line); }
  .jumpbar a { font-size: 12.5px; padding: 4px 9px; border-radius: 5px; text-decoration: none;
    color: var(--muted); border: 1px solid transparent; }
  .jumpbar a:hover { background: var(--hover); color: var(--ink); border-color: var(--line); }
  /* Anchored headings clear the sticky topbar + jumpbar instead of hiding under them. */
  #main [id^="wo-"], #main [id^="pt-"] { scroll-margin-top: calc(var(--topbar-h) + 56px); }
  .muted { color: var(--muted); }
  .warn { color: var(--bad); font-weight: 600; }
  .ok { color: var(--ok); font-weight: 600; }
  textarea { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; min-height: 44px; }

  table.sub { width: 100%; border-collapse: collapse; margin: 4px 0; font-size: 13px; }
  table.sub th { text-align: left; background: var(--surface-2); padding: 5px 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  table.sub td { padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  table.sub input, table.sub select { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; }

  /* ---- projects board ----
     One track per status, derived from the children rather than a hardcoded
     count: PROJ_STATUS grew from 4 to 6 and a `repeat(4, 1fr)` silently wrapped
     Done and Cancelled onto a second row *under* To Do, which reads as two
     disconnected boards instead of one left-to-right flow. grid-auto-flow:column
     can't drift when a status is added. Tracks hold a 190px floor and the
     wrapper scrolls sideways rather than crushing them. */
  .boardwrap { overflow-x: auto; padding-bottom: 4px; }
  /* 176px floor: six tracks plus five 12px gaps fit inside the content box at
     any desktop width main allows, so a normal desktop shows the whole board
     with no scrollbar and the tracks still stretch — at the 1600px cap they
     reach about 250px each. Narrower windows scroll instead of crushing
     cards. */
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(176px, 1fr); gap: 12px; align-items: start; }
  /* Tablet and phone keep the original stacked sections, so go back to explicit
     row flow — auto-columns would ignore grid-template-columns entirely. */
  @media (max-width: 900px) { .boardwrap { overflow-x: visible; } .board { grid-auto-flow: row; grid-template-columns: repeat(2, 1fr); } }
  .col { background: var(--fill); border-radius: var(--r-md); padding: 8px; min-height: 80px; }
  .col.dragover { background: var(--info-bg); outline: 2px dashed var(--accent); }
  .col h4 { margin: 4px 6px 8px; font-family: var(--font-display); font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); display: flex; justify-content: space-between; }
  .pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 11px; margin-bottom: 8px; box-shadow: var(--shadow); cursor: grab; }
  .pcard:hover { border-color: var(--border-2); }
  .pcard .t { font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }
  /* Six tracks means ~180px cards, so the meta line wraps instead of breaking a
     date across three lines. nowrap on the children keeps "2026-08-02" and
     "High" whole; the .right group drops to its own line when it has to. */
  .pcard .meta { display: flex; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .pcard .meta > * { white-space: nowrap; }
  .pcard .meta .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .prio { font-size: 11px; font-weight: 700; }
  .prio.High { color: var(--bad); } .prio.Medium { color: var(--amber); } .prio.Low { color: var(--faint); }

  /* ---- project detail: files + comments ---- */
  .filegrid { display: flex; flex-wrap: wrap; gap: 10px; }
  .fileitem { width: 120px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); font-size: 11.5px; }
  .fileitem .thumb { height: 84px; background: var(--fill) center/cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--faint); }
  .fileitem .fn { padding: 5px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fileitem .fn a { color: var(--ink); text-decoration: none; }
  .comment { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .comment:first-of-type { border-top: none; }
  .comment .cbody { flex: 1; min-width: 0; }
  .comment .chead { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .comment .chead b { color: var(--ink); }
  .comment .ctext img { max-width: 100%; border-radius: 4px; margin: 4px 0; }
  .rte-toolbar { display: flex; gap: 2px; margin-bottom: 6px; flex-wrap: wrap; }
  .rte-toolbar button { padding: 4px 8px; font-size: 13px; }
  .rte { min-height: 60px; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; background: var(--surface); }
  .rte:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  /* Both editors carried a data-ph hint that nothing ever rendered, so the
     description and comment boxes were unlabelled blank rectangles. */
  .rte:empty::before { content: attr(data-ph); color: var(--faint); pointer-events: none; }

  /* ---- multi-select picker (assignees / parts) ---- */
  .picker { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .picker .chosen { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 6px; min-height: 34px; cursor: pointer; }
  .picker .pk-caret { margin-left: auto; display: inline-flex; color: var(--muted); }
  .picker .pk-caret svg { transition: transform var(--t-fast) var(--ease); }
  .picker .pk-caret.open svg { transform: rotate(180deg); }
  .picker .tok { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-soft); border-radius: 3px; padding: 2px 6px; font-size: 12px; }
  .picker .tok button { border: none; background: none; cursor: pointer; color: var(--muted); padding: 0 2px; }
  .picker input.psearch { width: 100%; border: none; border-top: 1px solid var(--line); padding: 6px 8px; font: inherit; }
  .picker .opts { max-height: 170px; overflow-y: auto; border-top: 1px solid var(--line); }
  .picker .opt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; font-size: 13px; }
  .picker .opt:hover { background: var(--hover); }
  .picker .opt.sel { background: var(--accent-soft); }

  /* ---- topbar icons + search + notifications ---- */
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; border: none; background: none; padding: 7px; position: relative; cursor: pointer; color: var(--muted); border-radius: 7px; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .icon-btn .badge { position: absolute; top: 0; right: 0; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; padding: 0 4px; min-width: 15px; text-align: center; line-height: 15px; }
  .gsearch { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); }
  .gsearch-results { margin-top: 8px; max-height: 55vh; overflow-y: auto; }
  .gsr { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; }
  .gsr:hover { background: var(--accent-soft); }
  .notif { padding: 9px 10px; border-radius: var(--radius); cursor: pointer; border-left: 3px solid transparent; }
  .notif:hover { background: var(--fill); }
  .notif.unread { border-left-color: var(--gold); background: var(--gold-bg); }

  /* ---- people ---- */
  .pname { font-weight: 600; }

  /* ---- toasts ---- */
  /* max(), not addition: 16px is already clear of most edges, and a toast
     floating 50px up from the bottom of a phone looks broken. Take the larger. */
  #toasts { position: fixed; right: max(16px, var(--sa-r)); bottom: max(16px, var(--sa-b)); z-index: 60; display: flex; flex-direction: column; gap: 8px; }
  .toast { padding: 10px 14px; border-radius: var(--radius); color: #fff; font-size: 13.5px; box-shadow: var(--shadow-md); max-width: 340px; opacity: 1; transition: opacity .3s, transform .3s; }
  .toast.hide { opacity: 0; transform: translateY(6px); }
  .toast.ok { background: var(--ok); } .toast.err { background: var(--bad); } .toast.info { background: var(--blue); }

  /* ---- modal ---- */
  #modal { position: fixed; inset: 0; display: none; z-index: 50; }
  #modal.open { display: block; }
  /* The backdrop is the scroll container, so its padding is what holds every
     modal card clear of the edges — and that means this one rule also covers
     the ⋯ menu, global search and the notifications panel, since core.js builds
     all three through openModal(). */
  #modal .backdrop { position: absolute; inset: 0; background: rgba(9,30,66,.54); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
    padding: max(40px, calc(var(--sa-t) + 12px)) max(16px, var(--sa-r)) max(40px, calc(var(--sa-b) + 12px)) max(16px, var(--sa-l)); }
  #modal .modal { background: var(--surface); border-radius: var(--r-md); width: 100%; max-width: 640px; box-shadow: var(--shadow-lg); padding: 22px 24px; }
  #modal .modal h2 { margin: 0 0 14px; font-size: 18px; }
  #modal .modal .field { margin-bottom: 12px; }
  #modal .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .moredetails { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 10px; }
  .moredetails > summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--accent);
    list-style: none; padding: 4px 0; user-select: none; }
  .moredetails > summary::-webkit-details-marker { display: none; }
  .moredetails > summary::before { content: "▸ "; display: inline-block; transition: transform var(--t-fast) var(--ease); }
  .moredetails[open] > summary::before { content: "▾ "; }
  .moredetails[open] { padding-bottom: 4px; }
  /* Sticky against the backdrop (the actual scroll container) so Create/Save
     stays reachable on a short laptop screen — the new-ticket form is tall
     enough to push it below the fold at 800px. */
  #modal .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px;
    position: sticky; bottom: -22px; z-index: 1; background: var(--surface);
    padding: 10px 0; margin-bottom: -10px; }

  /* ---- documents ---- */
  .doccat { margin-bottom: 8px; }
  .doclist { display: flex; flex-direction: column; }
  .docrow { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-top: 1px solid var(--line); cursor: pointer; }
  .docrow:hover { background: var(--hover); }
  .docrow .di { font-size: 18px; width: 24px; text-align: center; }
  .docrow .dsz { margin-left: auto; font-size: 11.5px; color: var(--faint); }
  .docview { width: 100%; height: 78vh; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .md-body h1 { font-size: 22px; } .md-body h2 { font-size: 18px; color: var(--brand-ink); } .md-body h3 { font-size: 14px; }
  .md-body table { border-collapse: collapse; margin: 8px 0; }
  .md-body th, .md-body td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; font-size: 13px; }
  .md-body blockquote { border-left: 3px solid var(--gold); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
  .md-body code { background: var(--fill); padding: 1px 4px; border-radius: 3px; }

  /* ---- 3D mold-in-stock viewer (meshview.js) ----
     Screen only; the printed/signed artifact stays the exploded SVG below it. */
  .meshview { position: relative; margin: 8px 0 4px; }
  .meshview canvas { width: 100%; height: 380px; display: block; border: 1px solid var(--line);
    border-radius: var(--r-md); background: var(--canvas); touch-action: none; cursor: grab; }
  .meshview canvas:active { cursor: grabbing; }
  .meshview-hint { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px;
    font-size: 12px; color: var(--muted); }
  .mv-swatch { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 2px; }
  .mv-swatch.mv-mold { background: var(--brand-blue); }
  .mv-swatch.mv-stock { background: rgba(253,181,21,.55); border: 1px solid var(--border-2); }
  .meshview-hint button { margin-left: auto; }
  .meshview-note { margin-top: 6px; }
  @media (max-width: 640px) { .meshview canvas { height: 260px; } }

  /* ---- stack viz + steps (work orders, carried) ---- */
  .stackviz { margin: 8px 0; }
  .stackviz .plybar { border: 1px solid var(--line); border-bottom: none; padding: 3px 10px; font-size: 12px; }
  .stackviz .plybar:last-child { border-bottom: 1px solid var(--line); }
  .plybar.cf { background: #3b4653; color: #fff; } .plybar.spread { background: #6b7684; color: #fff; }
  .plybar.core { background: var(--gold); } .plybar.mesh { background: #c98f4a; color: #fff; } .plybar.other { background: var(--fill); }
  .step { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
  .step:first-of-type { border-top: none; }
  .step .num { font-weight: 700; color: var(--brand-ink); min-width: 22px; }
  .step .body { flex: 1; } .step .meta { font-size: 12px; color: var(--muted); }
  .step .buyoff { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .step.blocker { background: var(--warn-bg); margin: 0 -8px; padding: 8px; }
  .step.done { opacity: .72; } .step.failed { background: var(--bad-bg); margin: 0 -8px; padding: 8px; }
  .step.upnext { border-left: 3px solid var(--accent); margin-left: -13px; padding-left: 10px; }
  .step-badge { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--amber); vertical-align: 1px; }

  /* ============================================================
     PARTS — master–detail split.
     Above 900px the tab is two panes: a persistent index that never goes away
     and the selected part beside it. The collapse to one-pane-at-a-time lives
     with every other width rule in the responsive block at the end of this
     sheet, not here — the only thing the markup carries is a selected flag.
     ============================================================ */
  /* The rail was a fixed 336px, so every pixel the window gained went to the
     detail pane and the index stayed the same width it had on a laptop. It is
     the thing you scan, so it grows too — but slowly, and it stops at 420
     because a wider rail just pads its two-line rows. */
  .mdsplit { display: grid; grid-template-columns: clamp(300px, 24vw, 420px) minmax(0, 1fr); gap: 16px; align-items: start; }
  .mddetail { min-width: 0; }
  /* The index outlives the detail, so it gets the card chrome and its own
     scroll: walking 33 parts must never scroll the part you're reading. */
  .mdindex { position: sticky; top: calc(var(--topbar-h) + 10px); max-height: calc(100dvh - var(--topbar-h) - 32px); display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); overflow: hidden; }
  .pindex-head { padding: 10px 11px 9px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .pindex-head .toolbar { margin-bottom: 8px; }
  .psum { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .psum-chip { padding: 3px 10px; font-size: 11px; border-radius: 999px; color: var(--muted); background: var(--surface);
    text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .psum-chip b { font-family: var(--font-display); font-size: 13px; color: var(--ink); margin-right: 2px; }
  .psum-chip.bad b { color: var(--bad); }
  .psum-chip.on { background: var(--blue); border-color: var(--brand-ink); color: #fff; }
  .psum-chip.on b { color: #fff; }
  .psum-chip.bad.on { background: var(--bad); border-color: var(--bad); }
  .pfilters { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
  .pfilters > input { grid-column: 1 / -1; }
  .pfilters input, .pfilters select { width: 100%; min-width: 0; font: inherit; font-size: 12.5px; padding: 5px 7px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); }
  .pfilters .sortdir { padding: 4px 9px; line-height: 1; }
  .pfilternote { margin-top: 7px; font-size: 12px; color: var(--muted); }
  /* Names the C/M/L marks once, where a table would put a column header. */
  .plegend { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 9px; margin-top: 8px; }
  .plegend .pl-k { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .plist { flex: 1; overflow-y: auto; padding: 6px; scrollbar-gutter: stable; scrollbar-width: thin; }
  .plist::-webkit-scrollbar { width: 10px; }
  .plist::-webkit-scrollbar-thumb { background: var(--border-2); border: 3px solid var(--card); border-radius: 999px; }
  /* Sticky at the foot of the scroller, pulled back over the last row: it fades
     whatever is under it while there is more to scroll to, and sits harmlessly
     at the end of a short list. */
  .plistfade { position: sticky; bottom: -6px; height: 26px; margin: -26px 0 0; pointer-events: none;
    background: linear-gradient(to top, var(--card) 20%, transparent); }
  /* One header per subteam, only when the rail is grouped. */
  .pgrouphd { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; position: sticky; top: -6px; z-index: 1;
    margin: 8px 0 3px; padding: 5px 9px; border-radius: var(--radius); background: var(--surface-2); font-size: 11px; color: var(--muted); }
  .pgrouphd:first-child { margin-top: 0; }
  .pgrouphd .pg-name { font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); }
  .pgrouphd .pg-n { white-space: nowrap; }
  .pgrouphd .pg-late { display: inline-flex; align-items: center; gap: 3px; color: var(--bad); font-weight: 700; }
  .pempty { padding: 22px 12px; text-align: center; }
  .keyhint { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 10px; padding: 6px 10px;
    border-top: 1px solid var(--line); background: var(--surface-2); }
  .keyhint span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  kbd { font: 600 10.5px/1.5 var(--font); border: 1px solid var(--border-2); border-bottom-width: 2px; border-radius: 4px;
    padding: 0 4px; background: var(--surface); color: var(--muted); }

  /* One index row. Two lines at index width, one line when the index owns the
     whole screen (see the responsive block). */
  .pitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; align-items: center;
    padding: 7px 9px; margin-bottom: 2px; border: 1px solid transparent; border-radius: 7px; cursor: pointer;
    transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
  .pitem:hover { background: var(--hover); }
  .pitem .pi-name { grid-row: 1; grid-column: 1; font-weight: 600; font-size: 13.5px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pitem .pi-due { grid-row: 1; grid-column: 2; display: inline-flex; align-items: center; gap: 3px;
    font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .pitem .pi-sub { grid-row: 2; grid-column: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pitem .pi-who { grid-row: 2; grid-column: 2; display: inline-flex; justify-self: end; }
  .pitem .pi-who .avatar { margin-left: -5px; box-shadow: 0 0 0 2px var(--card); }
  .pitem .pi-who .avatar:first-child { margin-left: 0; }
  .pitem.isdone .pi-name { font-weight: 500; color: var(--muted); }
  .pitem.sel { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .pitem.sel .pi-name { color: var(--brand-ink); }

  /* The three-stage rail. One mark per stage instead of a pill AND a bar for
     each: colour says which state, the underline says how far, the tooltip and
     the detail pane carry the exact wording. */
  .prog3 { display: inline-flex; gap: 3px; flex: none; }
  .prog3 .sg { position: relative; display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
    width: 26px; height: 16px; border-radius: 4px; border: 1px solid var(--line); background: var(--fill);
    color: var(--muted); font-size: 9.5px; font-weight: 800; }
  .prog3 .sg b { position: relative; z-index: 1; }
  .prog3 .sg i { position: absolute; left: 0; bottom: 0; height: 3px; background: currentColor; opacity: .9; }
  .prog3 .sg.st-mid { background: var(--warn-bg); border-color: var(--warn-border); color: var(--amber); }
  .prog3 .sg.st-done { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
  .prog3 .sg.st-na { background: var(--retro-bg); border-color: var(--retro-border); color: var(--retro); opacity: .6; }

  /* Part detail */
  .mdnav { margin-left: auto; display: inline-flex; gap: 4px; }
  .pdue { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 11px; font-size: 13px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
  .pdue.late { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad); }
  .pdue.late .muted { color: var(--bad); }
  .editnote { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 7px 11px; font-size: 12.5px; font-weight: 600;
    border: 1px solid var(--accent-soft); border-radius: var(--radius); background: var(--info-bg); color: var(--brand-ink); }
  /* The stage stepper: the whole enum as tappable steps, so advancing a stage
     is one click with no edit mode and no dropdown to open. Steps are laid out
     with flex-wrap and sized by their own text — they get taller on a phone
     (see the responsive block), they never get narrower. */
  .pstages { display: grid; gap: 6px; }
  .pstage { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 6px 12px; align-items: center;
    padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
  .pstage .ps-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .pstage .ps-steps { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .pstage .ps-cap { grid-column: 2; margin-top: -2px; }
  .pstep { font: inherit; font-size: 12.5px; font-weight: 600; line-height: 1.1; min-height: 30px; padding: 6px 13px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    /* Wraps rather than overflows: in a narrow split pane "Mold CAD/CAM Done"
       is wider than the column, and nowrap made it hang off the edge (and,
       in landscape, under the island) instead of taking a second line. */
    white-space: normal; text-align: center; max-width: 100%;
    border: 1px solid var(--border-2); border-radius: 999px; background: var(--card); color: var(--muted);
    transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
  .pstep:hover { background: var(--hover); color: var(--ink); border-color: var(--accent); }
  /* A step already behind you is a muted fill and nothing more. NOT green, and
     NOT ticked: in this app green-with-a-tick means finished, and a green
     "Not Started" is the exact class of colour bug the tab was rebuilt to fix. */
  .pstep.past { background: var(--fill); color: var(--muted); border-color: var(--line); }
  .pstep.cur { cursor: default; font-weight: 700; box-shadow: inset 0 0 0 1px currentColor; }
  .pstep.cur:hover { border-color: currentColor; }
  .pstep.cur.st-0 { background: var(--fill); border-color: var(--border-2); color: var(--muted); }
  .pstep.cur.st-mid { background: var(--warn-bg); border-color: var(--warn-border); color: var(--amber); }
  .pstep.cur.st-done { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
  .pstep.cur.st-na { background: var(--retro-bg); border-color: var(--retro-border); color: var(--retro); }
  .pstep.na:not(.cur) { border-style: dashed; }

  /* The undo bar. A stepper click writes for the whole team, so every write
     leaves one of these until it is undone or dismissed — a toast fades before
     you have finished noticing you mis-tapped. */
  /* Sticky under the topbar, because the tap that needs undoing can be most of
     a page down — on a phone you set a stage near the foot of the detail pane,
     and an undo bar pinned to the top of the tab would be offscreen at exactly
     the moment it is wanted. Below the topbar's z-index, above the panes. */
  .undobar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 8px 12px; font-size: 13px;
    border: 1px solid var(--ok-border); border-radius: var(--r-md); background: var(--ok-bg); color: var(--ink);
    position: sticky; top: calc(var(--topbar-h) + 8px); z-index: 4; box-shadow: var(--shadow-md); }
  .undobar .ub-i { display: inline-flex; color: var(--ok); }
  .undobar .ub-t { flex: 1; min-width: 0; }
  .pgrid { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .linkgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 14px; }
  .lg-label { text-transform: uppercase; letter-spacing: .04em; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .pengrow { margin-top: 12px; }
  .engchip { padding: 2px 9px 2px 3px; }
  .engchip.on { background: var(--blue); border-color: var(--brand-ink); color: #fff; }
  .pnote { margin-bottom: 12px; }
  .pnote .notebody { padding: 2px 0; }

  /* The four season numbers, above the right pane in BOTH its states. Compact
     is the one that sits above an open part: same four, half the height, so it
     costs a strip rather than a screenful of the record you came to read. */
  .pstats { margin-bottom: 12px; }
  .pstats.compact { grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 8px; margin: 0 0 10px; }
  .pstats.compact .stat-tile { padding: 7px 11px; display: flex; align-items: baseline; gap: 7px; }
  .pstats.compact .bignum { font-size: 17px; }
  .pstats.compact .stat-label { margin-top: 0; }
  .pbehind { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 11px; }
  .pbehind span { flex: 1; min-width: 180px; }

  /* Right pane with nothing selected: the season read the list never had. */
  .stagebreak { margin-bottom: 11px; }
  .stagebreak .sb-label { font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
  .stagebreak .sb-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--fill); }
  .sb-seg.st-0 { background: var(--border-2); }
  .sb-seg.st-mid { background: var(--amber); }
  .sb-seg.st-done { background: var(--ok); }
  .sb-seg.st-na { background: var(--retro); }
  .sb-nums { margin-top: 4px; }
  .sb-nums .mid { color: var(--amber); } .sb-nums .done { color: var(--ok); } .sb-nums .na { color: var(--retro); }
  .pmini { display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-top: 1px solid var(--line);
    border-radius: var(--radius); cursor: pointer; }
  .pmini:hover { background: var(--hover); }
  .pmini .pm-name { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pmini .pm-due { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* ---- timeline grid ----
     Stations are ROWS, weeks are COLUMNS. It used to be the other way round,
     which put the growing axis (weeks, one per week of the season, forever) on
     the axis that makes the page longer, and the fixed axis (seven stations,
     set in timeline.js) on the axis that has to fit. That is what forced the
     old `min-width: 900px` and made the tab 2.3 screens wide on a phone. It is
     also the transpose of the mockup this tab was designed from
     (03 App/design/timeline-weeklyplan-mockup-20260728.png), and the wrong way
     round for the question the tab exists to answer, which is "when is Mold 1
     free" — a single horizontal scan now, a column-hunt across eleven columns
     before.

     The DOM is week-major: one .tl-wk per week, holding a header and one cell
     per row. `display: contents` on it means grid-auto-flow:column lays each
     of those groups out as one column, with no computed grid coordinates and
     no inline styles anywhere. That is also what lets the same markup fall
     back to one card per week below 900 without reordering a thing — a
     transposed TABLE could not, because CSS cannot regroup cells by column. */
  .tlgrid {
    display: grid; grid-template-columns: 168px; grid-auto-columns: minmax(136px, 1fr);
    grid-auto-flow: column; grid-template-rows: auto repeat(9, minmax(40px, auto));
    overflow-x: auto; overscroll-behavior-x: contain; scroll-padding-left: 168px;
    scrollbar-width: thin;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-md); box-shadow: var(--shadow);
  }
  /* The fade at the scrollable edge. A styled scrollbar is not enough on its
     own: macOS hides overlay scrollbars until you actually scroll, so a season
     wider than the window read as a grid whose last column had been cut off
     mid-word rather than one there is more of. The .more-* classes are set
     from the real scroll position by syncTimelineScroll(), so the fade appears
     only on the side that has something behind it and never on a season that
     fits. */
  .tlwrap { position: relative; }
  .tlwrap::before, .tlwrap::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 34px; pointer-events: none;
    opacity: 0; transition: opacity var(--t) var(--ease); z-index: 3; border-radius: var(--r-md);
  }
  .tlwrap::before { left: 168px; background: linear-gradient(to right, var(--card), transparent); }
  .tlwrap::after { right: 0; background: linear-gradient(to left, var(--card), transparent); }
  .tlwrap.more-left::before, .tlwrap.more-right::after { opacity: 1; }
  .tlgrid::-webkit-scrollbar { height: 10px; }
  .tlgrid::-webkit-scrollbar-thumb { background: var(--border-2); border: 3px solid var(--card); border-radius: 999px; }
  .tl-stations, .tl-wk { display: contents; }
  /* The station rail pins while the weeks scroll past it. Needs an opaque
     background of its own or the cells slide under it. */
  .tl-corner, .tl-strow {
    position: sticky; left: 0; z-index: 2; background: var(--surface-2);
    border-right: 1px solid var(--line); border-top: 1px solid var(--line);
    padding: 9px 12px; font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); display: flex; align-items: center;
  }
  .tl-corner { border-top: none; }
  /* Other and Notes are per-week free text, not stations. Same rows, heavier
     rule above them so the seven real stations read as a group. */
  .tl-strow.tl-sep { border-top: 2px solid var(--border-2); }
  /* Deliberately NOT sticky. It is a grid item, and a vertical `position:
     sticky` on one detaches it from the row its station label is in — the
     header floats up to the topbar while the rail scrolls away, and the two
     stop describing each other. The grid is ten rows tall, so there is nothing
     to gain: it is the WEEKS that scroll here, and that is horizontal, which
     the station rail already pins for. */
  .tl-wkhd {
    background: var(--surface-2); padding: 8px 11px; border-bottom: 1px solid var(--line);
    font-family: var(--font-display); font-weight: 600; color: var(--brand-ink);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 40px;
  }
  /* A 136px column is narrow enough to break "Jul 28" across two lines, which
     reads as two dates. */
  .tl-wkdate { white-space: nowrap; }
  /* One trash can per week is eleven trash cans across a season. Present, and
     quiet until you are actually in that column. Touch has no hover, so there
     it just stays visible. */
  .tl-del { margin-left: auto; opacity: 0; transition: opacity var(--t-fast) var(--ease); }
  .tl-wk:hover .tl-del, .tl-wk:focus-within .tl-del, .tl-del:focus-visible { opacity: 1; }
  @media (pointer: coarse) { .tl-del { opacity: 1; } }
  /* A cell is a button: tapping it opens the assign picker. Everything here
     after `display` is undoing the app's own button styling, which is a full
     outlined control and would draw 90 of them in a grid. */
  .tl-cell {
    display: flex; align-items: center; gap: 6px; width: 100%; min-height: 40px;
    padding: 6px 9px; font: inherit; font-size: 13px; text-align: left; color: var(--ink);
    background: none; border: none; border-top: 1px solid var(--line); border-radius: 0;
    cursor: pointer; transition: background var(--t-fast) var(--ease);
  }
  .tl-cell:hover { background: var(--hover); }
  /* An empty cell says nothing. "open" written into all 45 of them was the
     most repeated text on the tab, and it was what set the column width. The
     tap affordance comes back on hover instead, and the toolbar says it in
     words once. */
  .tl-cell.empty { color: var(--faint); }
  .tl-cell.empty .tl-open { visibility: hidden; }
  .tl-cell.empty:hover .tl-open, .tl-cell.empty:focus-visible .tl-open { visibility: visible; }
  .tl-note { font-style: normal; white-space: normal; font-size: 12.5px; }
  .tl-wk.retro .tl-cell, .tl-wk.retro .tl-wkhd { background: var(--retro-bg); }
  /* This week, on the one grid where "which one is now" is the whole question.
     The same gold edge the rest of the app uses for "today", rotated with the
     grid: it was the row's left border, it is the column's top. Last so it
     beats .retro. */
  .tl-cell.now, .tl-wkhd.now { background: var(--gold-bg); }
  .tl-wkhd.now { box-shadow: inset 0 3px 0 var(--gold); }
  .tl-stname { display: none; }
  .tl-archive { margin-top: 14px; }
  .tl-empty { text-align: center; padding: 26px 16px; }
  .tl-empty .tl-ei { color: var(--faint); }
  .tl-empty p { color: var(--muted); margin: 6px 0 14px; }
  .tl-empty .toolbar.tl-center { justify-content: center; }
  .tl-hint { align-self: center; }
  /* Phone-only affordance: on a wide screen the past weeks are in the grid
     already and the button would reveal nothing. */
  .tl-earlier { display: none; }
  /* Weekly Plan: per-person goal checklists + carpool cards. */
  .task-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .task-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--ok); flex-shrink: 0; }
  .task-row.done .tsk-text { text-decoration: line-through; color: var(--faint); }
  .due-pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--fill); color: var(--muted); font-weight: 600; white-space: nowrap; margin-left: auto; }
  .due-pill.soon { background: var(--warn-bg); color: var(--amber); }
  .due-pill.late { background: var(--bad-bg); color: var(--bad); }
  .carcard { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; }
  .carcard-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .carcard-seats { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .seat-open { width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--border-2); color: var(--faint); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }

  /* dashboard */
  .dashgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .bignum { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--brand-ink); letter-spacing: .01em; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .stat-tile { background: var(--surface-2); border-radius: var(--r-md); padding: 12px 14px; }
  .stat-tile .bignum { font-size: 22px; }
  .stat-tile .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; margin-top: 2px; }
  .glance { display: flex; gap: 10px; flex-wrap: wrap; }
  .gitem { flex: 1; min-width: 70px; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; }
  .gitem:hover { background: var(--hover); }
  .gitem .gn { font-size: 22px; font-weight: 700; color: var(--brand-ink); }
  .gitem .gl { font-size: 11px; color: var(--muted); text-transform: uppercase; }

  /* login */
  .login { max-width: 430px; margin: 8vh auto 0; }
  .login .f { margin: 10px 0; }
  .login .f label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .login .f input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); }
  .login .row { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .updates { display: flex; flex-direction: column; gap: 6px; }
  .sig { margin-top: 26px; display: none; }
  .sig .line { display: inline-block; width: 260px; border-bottom: 1px solid #000; margin: 0 30px 4px 0; }

  /* The print sheet lives in #printroot and is hidden on screen unless a
     preview is open. See print.js / print.css. */
  #printroot:empty { display: none; }
  body.previewing #app { display: none; }

  /* ============================================================
     REVAMP POLISH — icon-in-button alignment, hover micro-interactions,
     motorsport accents.

     This block used to also re-declare .card, table.list, .pill, .stage, .chip,
     .kind, .col and .col h4 purely to correct a radius or a font that the base
     rule above had hardcoded. It reached the right answer by overriding itself
     forty lines later, which meant every one of those components had two
     competing declarations and tools/test_designsystem.mjs could not tell which
     was the real one. The corrections now live in the base rules; what is left
     here is genuinely additive.
     ============================================================ */
  .ib { display: inline-flex; align-items: center; gap: 6px; }
  .cnt { display: inline-flex; align-items: center; gap: 3px; }
  .cnt .ico { opacity: .7; }
  /* hover response */
  .card { transition: box-shadow var(--t) var(--ease), border-color var(--t) var(--ease); }
  table.list td, .docrow, .gitem { transition: background var(--t-fast) var(--ease); }
  /* The BARE elements, styled — which the app was not doing. It styled
     `.filters input`, `.field input` and `.grid .f input` and left everything
     else to the browser, so any control outside one of those three containers
     rendered as a UA default: the Tickets search box, the People role select,
     the Work Orders process select, the Weekly Plan week picker. On a light
     theme that reads as merely plain. In dark mode it is a pale grey box on a
     near-black page, which is what a screenshot review caught.
     Same declarations as 06 Design System/components.css, which had this right
     all along; test_designsystem.mjs now fails when the app omits a visual
     property the system declares, so this cannot silently come apart again. */
  input, select, textarea {
    font: inherit; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--ink);
    transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
  .grid .f input:focus, .grid .f select:focus, .field input:focus, .field select:focus,
  .filters input:focus, .filters select:focus, .login .f input:focus, textarea:focus,
  table.sub input:focus, table.sub select:focus, .tlgrid input:focus, .tlgrid select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  /* project cards + stat tiles lift on hover */
  .pcard { transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
  .pcard:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--border-2); }
  .gitem { transition: transform var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
  .gitem:hover { transform: translateY(-1px); border-color: var(--accent); background: var(--surface); }
  .gitem .gn { font-family: var(--font-display); }
  /* board columns: a status-colored accent strip across the top (states + colors
     defined in the tickets block above, since they're the same 6-value enum) */
  .col { border: 1px solid var(--line); position: relative; overflow: hidden; }
  .col::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--border-2); }
  .chip { transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }

  /* ============================================================
     RESPONSIVE. Placed at the end on purpose: at equal specificity the later
     rule wins, so keeping every screen-width override here means it reliably
     beats the base rules above. Wide (≥1500) lets the auto-fit grids add a
     column; tablet (≤900) folds the sidebar into a slide-in drawer; phone
     (≤640) also stacks tables and the board and slims the topbar. A 1440
     laptop is the untouched default in the middle.
     ============================================================ */

  /* Raising main's cap to 1600 hands every auto-fit grid roughly 460 extra
     pixels, and auto-fit spends them by stretching the columns it already has
     rather than adding one — a 320px floor with 1560px to fill gives four
     tracks of 390px, which is a wider card holding the same amount of text.
     Raising the floors here makes the extra width buy a column instead. Only
     at 1500+, because these floors would force a scrollbar on a laptop. */
  @media (min-width: 1500px) {
    .dashgrid { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
    .pgrid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .linkgrid { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .grid { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
    .stat-row { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  }

  @media (max-width: 900px) {
    .hamburger { display: inline-flex; align-items: center; }
    nav.sidebar {
      position: fixed; top: 0; left: 0; height: 100vh; height: 100dvh;
      width: 264px; max-width: 84vw; z-index: 40;
      transform: translateX(-100%); transition: transform .22s ease;
      box-shadow: 2px 0 18px rgba(9,30,66,.32); overflow-y: auto;
      /* All three, not just the top. Pinned to left:0, so in landscape the FEB
         mark and every nav label sit under a left-hand island without --sa-l;
         and it is 100dvh with its own scroll, so without --sa-b there is
         nothing left to scroll the last nav item clear of the home indicator. */
      padding-top: var(--sa-t); padding-left: var(--sa-l); padding-bottom: var(--sa-b);
    }
    body.drawer-open nav.sidebar { transform: translateX(0); }
    #drawer-backdrop {
      display: block; position: fixed; inset: 0; z-index: 35;
      background: rgba(9,30,66,.5); opacity: 0; pointer-events: none;
      transition: opacity .22s;
    }
    body.drawer-open #drawer-backdrop { opacity: 1; pointer-events: auto; }
    /* Narrower horizontal padding only — the safe-area insets are on the base
       rule now, and a shorthand here would reset them. */
    header.topbar { padding-left: max(14px, var(--sa-l)); padding-right: max(14px, var(--sa-r)); }
    main { padding: 16px max(14px, var(--sa-r)) calc(72px + var(--sa-b)) max(14px, var(--sa-l)); }

    /* Swap the account/admin row for the ⋯ menu at the SAME width the sidebar
       becomes a drawer. This used to happen at 640, so between 641 and ~1000 a
       lead got Backup + Restore + Load SN5 archive + Roster + avatar + name +
       Sign out on one line and the topbar overflowed the page sideways. The ⋯
       menu already contains every one of those actions. */
    .tb-desktop { display: none; }
    .icon-btn.tb-morebtn { display: inline-flex; }

    /* Wide list tables collapse into stacked cards across the whole compact
       range (matches the drawer breakpoint), so the 8-column Parts table can't
       run off a tablet either. Header row hidden, each row a card, each cell a
       `Label  value` line via the data-label set in core.js. The table's own
       border/shadow is dropped so the cards own the chrome. */
    table.list { display: block; border: none; box-shadow: none; background: none; border-radius: 0; overflow: visible; }
    table.list tbody { display: block; }
    /* The header row. `:first-child` is scoped to the PARENT, so on a table
       with <thead> and <tbody> this matches twice — the header row and the
       first data row, which then vanishes. Every list table in the app emits
       bare <tr>s with no <thead>, so it has never bitten, but it is a trap
       sitting in wait for the next one. Pinned to the actual header instead. */
    table.list tr:has(> th):first-child, table.list thead tr { display: none; }
    table.list tr {
      display: block; background: var(--card); border: 1px solid var(--line);
      border-radius: 8px; box-shadow: var(--shadow); padding: 10px 13px; margin-bottom: 10px;
    }
    table.list tr:hover td { background: none; }
    /* Label floats left, the whole value (which may be several spans, e.g. a
       date plus a "(179d late)" tag) stays grouped and right-aligned on the line
       rather than being spread apart by a flex distribution. */
    table.list td {
      display: block; padding: 4px 0 4px 92px; border: none; border-top: none; text-align: right;
    }
    table.list td::before {
      content: attr(data-label); float: left; margin-left: -92px; text-align: left;
      font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      color: var(--muted); white-space: nowrap; line-height: 1.5;
    }
    /* First cell is the card title (id / name), not a label:value row. */
    table.list td:first-child {
      display: block; text-align: left; font-size: 15px;
      padding: 0 0 7px; margin-bottom: 5px; border-bottom: 1px solid var(--line);
    }
    table.list td:first-child::before { display: none; }
    /* Empty trailing action cells shouldn't leave a dangling label. */
    table.list td:empty { display: none; }

    /* Narrow detail tables (BOM, quality, event log, roster) scroll sideways
       rather than blowing out their card. */
    table.sub { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }

    /* TIMELINE: the grid becomes one card per week, from the same DOM. The
       markup is week-major, so `display: block` alone puts the weeks in
       reading order with nothing reordered — which is the whole reason the
       wide layout is a grid and not a table.

       Not table.list's generic card collapse, on purpose. Once the tab is
       transposed that would give one card per STATION with weeks as
       label:value lines, and "what is on Mold 1 in every week of the season"
       is not the question anyone asks on a phone. The question is what is on
       this week. */
    .tlgrid { display: block; overflow: visible; border: none; background: none; box-shadow: none; }
    .tl-stations { display: none; }
    .tl-wk {
      display: block; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--r-md); box-shadow: var(--shadow); padding: 10px 13px; margin-bottom: 10px;
    }
    .tl-wk.now { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--gold), var(--shadow); }
    .tl-wkhd {
      position: static; background: none; border: none; border-bottom: 1px solid var(--line);
      padding: 0 0 8px; margin-bottom: 4px; font-size: 15px;
    }
    .tl-wk.retro .tl-wkhd, .tl-wk.retro .tl-cell { background: none; }
    /* The card already carries the gold edge; the header's own bar doubles it. */
    .tl-wkhd.now { box-shadow: none; }
    .tl-cell { border-top: none; min-height: 42px; padding: 6px 0; }
    /* A week card lists what is BOOKED. Seven "open" rows per week is six
       screens of nothing; the count and the assign button below say the same
       thing in one line. */
    .tl-cell.empty { display: none; }
    .tl-stname {
      display: inline-block; min-width: 92px; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    }
    /* Finished weeks, folded. Only here: on a wide screen they are part of the
       grid and scrolling past them costs one flick, but stacked they are eight
       screens between you and this week. */
    .tlgrid:not(.showpast) .tl-wk.past { display: none; }
    .tl-earlier { display: flex; }

    /* PARTS: the master–detail split collapses to one pane at a time — index,
       tap, detail, back — which is exactly what the tab did before the split
       existed. `.has-sel` is set by renderParts() whenever a part is selected,
       and it is the SAME condition the wide layout uses to decide what the
       right pane holds, so the two widths can never disagree about state. A
       squeezed two-column layout on a phone is the failure mode this avoids. */
    .mdsplit { grid-template-columns: 1fr; gap: 0; }
    .mdsplit.has-sel > .mdindex { display: none; }
    /* Nothing selected: the index is the page, and the season read that fills
       the right pane on a wide screen stacks UNDER it rather than being thrown
       away — one column, in the order you'd read it. */
    .mdsplit:not(.has-sel) > .mddetail { margin-top: 6px; }
    /* Index without its pane chrome: it IS the page here, so the rows carry the
       card look instead (the same shape the stacked list tables above use). */
    .mdindex { position: static; max-height: none; display: block; overflow: visible;
      background: none; border: none; border-radius: 0; box-shadow: none; }
    .pindex-head { padding: 0 0 10px; background: none; border-bottom: none; }
    .plist { padding: 0; overflow: visible; }
    /* The rail is the page here and the page scrolls, so there is no clipped
       edge to fade and no inner scrollbar to hint at. */
    .plistfade { display: none; }
    .pgrouphd { top: 0; }
    .pitem { margin-bottom: 8px; padding: 10px 13px; border-radius: 8px;
      background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .keyhint { display: none; }             /* no hardware keyboard down here */
    /* The rail toggle is meaningless in a drawer: the sidebar is already off
       screen, so there is no space to reclaim and collapsing it would just be
       a way to end up with icons and no labels in a panel you opened
       deliberately. */
    .sb-toggle { display: none; }
  }
  /* Tablet band — the intersection of the two breakpoints either side of it,
     not a third breakpoint of its own. What it buys: between 641 and 900 the
     split has already collapsed (≤900) so the index owns the full width, but
     the phone rules (≤640) haven't kicked in yet. A two-line index row that
     earns its shape in a 336px rail wastes most of an iPad's width and makes
     the list twice as long as it needs to be, so in this band alone the row is
     one line — name, stages, faces, deadline in fixed tracks. Delete this block
     and nothing breaks; the rows just go back to two lines and the list to
     twice the scrolling. */
  @media (min-width: 641px) and (max-width: 900px) {
