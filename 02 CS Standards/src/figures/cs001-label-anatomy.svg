<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Helvetica, Arial, sans-serif">
  <!-- CS-001 Fig 1: anatomy of the printed 4x1 in label, drawn at 2x. -->
  <rect width="880" height="360" fill="#ffffff"/>

  <!-- The label card: 4x1 in drawn as 640x160 -->
  <rect x="60" y="90" width="640" height="160" rx="6" fill="#ffffff" stroke="#333333" stroke-width="2"/>

  <!-- QR zone -->
  <rect x="76" y="106" width="128" height="128" fill="none" stroke="#333333" stroke-width="1"/>
  <g stroke="none" fill="#333333">
    <rect x="84" y="114" width="34" height="34"/>
    <rect x="162" y="114" width="34" height="34"/>
    <rect x="84" y="192" width="34" height="34"/>
    <rect x="92" y="122" width="18" height="18" fill="#ffffff"/>
    <rect x="170" y="122" width="18" height="18" fill="#ffffff"/>
    <rect x="92" y="200" width="18" height="18" fill="#ffffff"/>
    <rect x="130" y="120" width="8" height="8"/><rect x="146" y="128" width="8" height="8"/>
    <rect x="130" y="144" width="8" height="8"/><rect x="122" y="160" width="8" height="8"/>
    <rect x="146" y="160" width="8" height="8"/><rect x="162" y="168" width="8" height="8"/>
    <rect x="130" y="176" width="8" height="8"/><rect x="146" y="192" width="8" height="8"/>
    <rect x="162" y="204" width="8" height="8"/><rect x="178" y="184" width="8" height="8"/>
    <rect x="130" y="204" width="8" height="8"/><rect x="146" y="214" width="8" height="8"/>
  </g>

  <!-- Class word -->
  <text x="228" y="136" font-size="26" font-weight="bold" fill="#003262">PART</text>
  <!-- ID line with R&D box -->
  <text x="228" y="172" font-size="22" font-family="Courier New, monospace" fill="#111111">P-SN6-007</text>
  <rect x="386" y="152" width="66" height="26" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="419" y="171" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">R&amp;D</text>
  <!-- Name line -->
  <text x="228" y="200" font-size="15" fill="#333333">Diffuser center panel</text>
  <!-- Identifying fact line -->
  <text x="228" y="228" font-size="14" font-family="Courier New, monospace" fill="#333333">6X 195 TWILL + .125 NOMEX</text>

  <defs>
    <marker id="arr1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Callouts -->
  <line x1="140" y1="100" x2="140" y2="60" stroke="#333333" stroke-width="1" marker-end="none"/>
  <text x="140" y="48" text-anchor="middle" font-size="12" fill="#333333">QR: HTTPS://FEB-COMPOSITES.WEB.APP/Q/&lt;ID&gt;</text>
  <text x="140" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#003262">uppercase only, no query string (§4)</text>

  <line x1="290" y1="122" x2="290" y2="76" stroke="#333333" stroke-width="1"/>
  <text x="296" y="72" font-size="12" fill="#333333"><tspan font-weight="bold" fill="#003262">Class word</tspan>: mandatory, printed larger than the ID</text>

  <line x1="419" y1="152" x2="500" y2="120" stroke="#333333" stroke-width="1"/>
  <text x="506" y="118" font-size="12" fill="#333333"><tspan font-weight="bold" fill="#003262">R&amp;D mark</tspan>: ruled box on the ID line,</text>
  <text x="506" y="132" font-size="12" fill="#333333">only line whose length is capped (§7.6)</text>

  <line x1="300" y1="232" x2="300" y2="286" stroke="#333333" stroke-width="1"/>
  <text x="306" y="292" font-size="12" fill="#333333"><tspan font-weight="bold" fill="#003262">The identifying fact</tspan> for the class (§7.6): stack for parts,</text>
  <text x="306" y="306" font-size="12" fill="#333333">seal record for molds, vendor lot for materials</text>

  <line x1="180" y1="166" x2="228" y2="166" stroke="none"/>
  <line x1="226" y1="166" x2="180" y2="300" stroke="#333333" stroke-width="1"/>
  <text x="60" y="314" font-size="12" fill="#333333"><tspan font-weight="bold" fill="#003262">ID</tspan>: max 14 characters (CS-013 §4.1)</text>

  <!-- Dimensions -->
  <line x1="60" y1="266" x2="700" y2="266" stroke="#003262" stroke-width="1" marker-start="url(#arr1)" marker-end="url(#arr1)"/>
  <text x="520" y="282" text-anchor="middle" font-size="12" fill="#003262">4 in (Avery 5161; TZe-251 tape is 24 mm high)</text>
  <line x1="726" y1="90" x2="726" y2="250" stroke="#003262" stroke-width="1" marker-start="url(#arr1)" marker-end="url(#arr1)"/>
  <text x="740" y="174" font-size="12" fill="#003262">1 in</text>
</svg>
