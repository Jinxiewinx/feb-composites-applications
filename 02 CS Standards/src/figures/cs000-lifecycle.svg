<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Helvetica, Arial, sans-serif">
  <!-- CS-000 Fig 1: controlled-document status lifecycle. Grayscale-safe:
       states are distinguished by border weight and dash, not color alone. -->
  <rect width="880" height="300" fill="#ffffff"/>

  <!-- Draft -->
  <rect x="30" y="90" width="170" height="70" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="115" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#003262">Draft</text>
  <text x="115" y="137" text-anchor="middle" font-size="11" fill="#333333">usable as guidance,</text>
  <text x="115" y="151" text-anchor="middle" font-size="11" fill="#333333">not yet the rule</text>

  <!-- Released -->
  <rect x="300" y="90" width="170" height="70" rx="8" fill="#ffffff" stroke="#003262" stroke-width="3"/>
  <text x="385" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#003262">Released</text>
  <text x="385" y="137" text-anchor="middle" font-size="11" fill="#333333">current practice;</text>
  <text x="385" y="151" text-anchor="middle" font-size="11" fill="#333333">approver row signed</text>

  <!-- Under Revision -->
  <rect x="300" y="215" width="170" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="385" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#003262">Under Revision</text>
  <text x="385" y="258" text-anchor="middle" font-size="11" fill="#333333">follow it; changes coming</text>

  <!-- Retired -->
  <rect x="640" y="90" width="200" height="70" rx="8" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="740" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Retired</text>
  <text x="740" y="137" text-anchor="middle" font-size="11" fill="#333333">kept for history; header</text>
  <text x="740" y="151" text-anchor="middle" font-size="11" fill="#333333">names the replacement</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Draft -> Released -->
  <line x1="200" y1="125" x2="296" y2="125" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="112" text-anchor="middle" font-size="10.5" fill="#333333">review + Lead signs</text>
  <text x="248" y="146" text-anchor="middle" font-size="10.5" fill="#333333">(CS-000 §7.1)</text>

  <!-- Released -> Under Revision (down) and back (up) -->
  <line x1="360" y1="160" x2="360" y2="211" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="352" y="192" text-anchor="end" font-size="10.5" fill="#333333">change proposed (§7.2)</text>
  <line x1="410" y1="215" x2="410" y2="164" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="418" y="192" font-size="10.5" fill="#333333">rev letter bumps, re-approved</text>

  <!-- Released -> Retired -->
  <line x1="470" y1="125" x2="636" y2="125" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="553" y="112" text-anchor="middle" font-size="10.5" fill="#333333">superseded or practice</text>
  <text x="553" y="146" text-anchor="middle" font-size="10.5" fill="#333333">discontinued (§7.3)</text>

  <!-- Top annotations -->
  <text x="115" y="66" text-anchor="middle" font-size="11" font-style="italic" fill="#333333">CS number reserved in</text>
  <text x="115" y="80" text-anchor="middle" font-size="11" font-style="italic" fill="#333333">CS-INDEX at first draft</text>
  <text x="740" y="73" text-anchor="middle" font-size="11" font-style="italic" fill="#333333">never deleted</text>

  <!-- Blank-approver rule -->
  <rect x="30" y="20" width="0" height="0" fill="none"/>
  <text x="440" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#003262">A doc whose Approver row is blank is never Released. No exceptions.</text>
</svg>
