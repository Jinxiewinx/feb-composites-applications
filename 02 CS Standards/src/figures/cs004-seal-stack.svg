<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Helvetica, Arial, sans-serif">
  <!-- CS-004 Fig 1: what ends up on the mold surface, in order, plus the
       overcoat timing window that governs the XCR coats. -->
  <rect width="880" height="430" fill="#ffffff"/>
  <defs>
    <pattern id="board2" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f2f2f2"/>
      <circle cx="3" cy="3" r="1" fill="#bbbbbb"/><circle cx="9" cy="8" r="1" fill="#bbbbbb"/>
    </pattern>
    <marker id="arr5" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#333333"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="14" font-weight="bold" fill="#003262">The release stack, mold surface up</text>

  <!-- Layer diagram -->
  <rect x="60" y="230" width="480" height="60" fill="url(#board2)" stroke="#333333" stroke-width="2"/>
  <text x="300" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">machined tooling board (open-celled, porous)</text>

  <rect x="60" y="204" width="480" height="26" fill="#d9d9d9" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="222" text-anchor="middle" font-size="12" fill="#111111">XCR seal coats ×1–2 (100:41 by weight, thin, never pooled)</text>

  <rect x="60" y="186" width="480" height="18" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="300" y="199" text-anchor="middle" font-size="11" fill="#333333">Formula Five wax ×4 (new mold), buffed between coats</text>

  <rect x="60" y="170" width="480" height="16" fill="#e6e6e6" stroke="#333333" stroke-width="1.2"/>
  <text x="300" y="182" text-anchor="middle" font-size="11" fill="#333333">Partall #10 PVA film ×2, each dried to gloss</text>

  <rect x="60" y="140" width="480" height="30" fill="#ffffff" stroke="#333333" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="300" y="160" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">laminate goes here (CS-006 / CS-007)</text>

  <!-- Callouts -->
  <line x1="548" y1="217" x2="600" y2="217" stroke="#333333" stroke-width="0.8"/>
  <text x="606" y="212" font-size="11" fill="#333333">seals the cells so laminating resin</text>
  <text x="606" y="226" font-size="11" fill="#333333">cannot soak in and lock the part on</text>
  <line x1="548" y1="178" x2="600" y2="178" stroke="#333333" stroke-width="0.8"/>
  <text x="606" y="174" font-size="11" fill="#333333">sacrificial release layers:</text>
  <text x="606" y="188" font-size="11" fill="#333333">renewed every pull (§7.4)</text>

  <!-- Timing bar -->
  <text x="30" y="330" font-size="14" font-weight="bold" fill="#003262">XCR overcoat window at 20 °C (from R1; halves at 30 °C)</text>
  <line x1="60" y1="370" x2="820" y2="370" stroke="#333333" stroke-width="2"/>
  <!-- ticks -->
  <g stroke="#333333" stroke-width="1.5">
    <line x1="60" y1="362" x2="60" y2="378"/>
    <line x1="100" y1="362" x2="100" y2="378"/>
    <line x1="420" y1="362" x2="420" y2="378"/>
    <line x1="700" y1="362" x2="700" y2="378"/>
  </g>
  <rect x="100" y="356" width="320" height="28" fill="#d9d9d9" stroke="none" opacity="0.6"/>
  <text x="60" y="398" text-anchor="middle" font-size="11" fill="#333333">mix</text>
  <text x="60" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">t = 0</text>
  <text x="100" y="398" text-anchor="middle" font-size="11" fill="#333333">pot life ends</text>
  <text x="100" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">8 min (150 g)</text>
  <text x="260" y="350" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#003262">overcoat here: firm-but-tacky, chemical bond, no prep</text>
  <text x="420" y="398" text-anchor="middle" font-size="11" fill="#333333">window closes</text>
  <text x="420" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">~2 h 50</text>
  <text x="560" y="350" text-anchor="middle" font-size="11.5" fill="#333333">tack-free: wait ≥9 h, key 120-grit, re-wipe</text>
  <text x="700" y="398" text-anchor="middle" font-size="11" fill="#333333">handleable</text>
  <text x="700" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">8 h 30</text>
  <text x="800" y="398" text-anchor="middle" font-size="11" fill="#333333">full props</text>
  <text x="800" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">≥14 days</text>
</svg>
