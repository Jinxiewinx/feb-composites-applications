<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Helvetica, Arial, sans-serif">
  <!-- CS-007 Fig 1: wet-layup vacuum bag cross-section. The rule drawn large:
       breather stays clear of part edges it could bond to. -->
  <rect width="880" height="360" fill="#ffffff"/>
  <defs>
    <pattern id="breath" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#ffffff"/>
      <circle cx="3.5" cy="3.5" r="2" fill="none" stroke="#7a7a7a" stroke-width="0.8"/>
    </pattern>
    <marker id="arr8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Mold -->
  <rect x="120" y="240" width="560" height="46" fill="#f2f2f2" stroke="#333333" stroke-width="2"/>
  <text x="400" y="270" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333333">mold / plate / shaped foam core (CS-004-prepped where applicable)</text>

  <!-- Wet laminate -->
  <rect x="220" y="222" width="360" height="18" fill="#d9d9d9" stroke="#333333" stroke-width="1.2"/>
  <text x="400" y="236" text-anchor="middle" font-size="10.5" fill="#111111">wet laminate, ply-by-ply per WO table</text>

  <!-- Peel ply: full coverage, past edges -->
  <rect x="206" y="212" width="388" height="10" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <line x1="594" y1="217" x2="700" y2="180" stroke="#333333" stroke-width="0.8"/>
  <text x="706" y="178" font-size="11.5" fill="#333333"><tspan font-weight="bold" fill="#003262">peel ply</tspan>: covers the full</text>
  <text x="706" y="192" font-size="11.5" fill="#333333">laminate and its edges</text>

  <!-- Breather: INBOARD of the part edges -->
  <rect x="252" y="192" width="296" height="20" fill="url(#breath)" stroke="#333333" stroke-width="1.2"/>
  <line x1="548" y1="202" x2="700" y2="128" stroke="#333333" stroke-width="0.8"/>
  <text x="706" y="122" font-size="11.5" fill="#333333"><tspan font-weight="bold" fill="#003262">breather</tspan>: kept clear of part</text>
  <text x="706" y="136" font-size="11.5" fill="#333333">edges it could bond to; resin</text>
  <text x="706" y="150" font-size="11.5" fill="#333333">that wicks in glues it on</text>

  <!-- edge gap dimension -->
  <line x1="220" y1="186" x2="252" y2="186" stroke="#003262" stroke-width="1.2" marker-end="url(#arr8)"/>
  <text x="214" y="176" text-anchor="end" font-size="10.5" font-weight="bold" fill="#003262">gap at every edge</text>

  <!-- Bag -->
  <path d="M 138 242 Q 150 160 240 156 L 560 156 Q 650 160 662 242" fill="none" stroke="#333333" stroke-width="2"/>
  <path d="M 330 156 l 9 -16 l 9 16" fill="none" stroke="#333333" stroke-width="1.2"/>
  <path d="M 460 156 l 9 -16 l 9 16" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="400" y="112" text-anchor="middle" font-size="11" fill="#333333">VB160 + pleats at corners (CS-006 §7.3 rules apply)</text>

  <!-- Tacky tape -->
  <rect x="128" y="236" width="16" height="10" fill="#333333"/>
  <rect x="656" y="236" width="16" height="10" fill="#333333"/>

  <!-- Vacuum line -->
  <circle cx="600" cy="200" r="9" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <path d="M 600 191 Q 600 60 720 60 L 760 60" fill="none" stroke="#333333" stroke-width="2"/>
  <rect x="760" y="40" width="56" height="40" rx="5" fill="#ffffff" stroke="#003262" stroke-width="2.5"/>
  <text x="788" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#003262">TRAP</text>
  <text x="788" y="72" text-anchor="middle" font-size="9" fill="#333333">then pump</text>

  <!-- Numbers strip -->
  <rect x="60" y="306" width="760" height="38" fill="#f2f2f2" stroke="#333333" stroke-width="1"/>
  <text x="440" y="330" text-anchor="middle" font-size="12" fill="#111111"><tspan font-weight="bold">Vacuum:</tspan> ≥25 inHg · drop test ≤2 inHg over 10 min before walking away · reduce if a light foam core dents (§7, step 10)</text>
</svg>
