<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Helvetica, Arial, sans-serif">
  <!-- CS-003 Fig 1: female mold cross-section with the §7.1 design rules
       dimensioned where they apply. -->
  <rect width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#333333"/>
    </marker>
    <marker id="arr4s" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M9,0 L0,4 L9,8 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Mold block: flange, cavity with drafted walls, flange -->
  <path d="M 80 320 L 80 150 L 300 150 L 330 160 L 350 280 Q 355 300 375 300 L 505 300 Q 525 300 530 280 L 550 160 L 580 150 L 800 150 L 800 320 Z"
        fill="#ffffff" stroke="#333333" stroke-width="2.5"/>
  <text x="440" y="345" text-anchor="middle" font-size="12" fill="#333333">glued tooling-board stack (Ure-Bond 90, 4 h clamp, §7.3)</text>
  <!-- glue lines -->
  <line x1="80" y1="235" x2="800" y2="235" stroke="#333333" stroke-width="0.8" stroke-dasharray="8 5"/>
  <line x1="80" y1="292" x2="345" y2="292" stroke="#333333" stroke-width="0.8" stroke-dasharray="8 5"/>
  <line x1="535" y1="292" x2="800" y2="292" stroke="#333333" stroke-width="0.8" stroke-dasharray="8 5"/>

  <!-- Flange dimension -->
  <line x1="80" y1="130" x2="300" y2="130" stroke="#003262" stroke-width="1.2" marker-start="url(#arr4s)" marker-end="url(#arr4)"/>
  <text x="190" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#003262">flange ≥75 mm flat beyond part edge</text>
  <text x="190" y="104" text-anchor="middle" font-size="10.5" fill="#333333">tacky tape + spiral line + trim allowance all live here</text>

  <!-- Scribe lines -->
  <path d="M 310 153 l 4 6 l 4 -6" fill="none" stroke="#333333" stroke-width="1.5"/>
  <path d="M 562 153 l 4 6 l 4 -6" fill="none" stroke="#333333" stroke-width="1.5"/>
  <line x1="314" y1="162" x2="270" y2="60" stroke="#333333" stroke-width="0.8"/>
  <text x="266" y="52" text-anchor="end" font-size="12" fill="#333333"><tspan font-weight="bold" fill="#003262">scribe V-grooves</tspan>: part trim line + two datums;</text>
  <text x="266" y="66" text-anchor="end" font-size="12" fill="#333333">must survive sealing (CS-004 §7.3.5)</text>

  <!-- Draft angle -->
  <line x1="350" y1="280" x2="330" y2="160" stroke="none"/>
  <line x1="352" y1="290" x2="352" y2="170" stroke="#333333" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="410" y="205" font-size="12" font-weight="bold" fill="#003262">≥2° draft on deep walls</text>
  <text x="410" y="220" font-size="10.5" fill="#333333">no overhangs: every face must have</text>
  <text x="410" y="234" font-size="10.5" fill="#333333">positive draft from the spindle direction</text>

  <!-- Internal fillet -->
  <circle cx="378" cy="295" r="14" fill="none" stroke="#333333" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="378" y1="309" x2="360" y2="380" stroke="#333333" stroke-width="0.8"/>
  <text x="356" y="394" text-anchor="end" font-size="12" fill="#333333"><tspan font-weight="bold" fill="#003262">internal fillets ≥ finishing-tool radius</tspan></text>

  <!-- Thin-section rule -->
  <line x1="530" y1="280" x2="580" y2="255" stroke="none"/>
  <line x1="545" y1="230" x2="545" y2="298" stroke="#003262" stroke-width="1.2" marker-start="url(#arr4s)" marker-end="url(#arr4)"/>
  <text x="600" y="258" font-size="12" font-weight="bold" fill="#003262">no unsupported section &lt;15 mm</text>
  <text x="600" y="272" font-size="10.5" fill="#333333">tooling board snaps (R3)</text>

  <!-- Max-Z -->
  <line x1="828" y1="150" x2="828" y2="320" stroke="#003262" stroke-width="1.2" marker-start="url(#arr4s)" marker-end="url(#arr4)"/>
  <text x="842" y="222" font-size="12" font-weight="bold" fill="#003262" transform="rotate(90 842 222)">total height ≤ machine max-Z (≈6 in)</text>

  <!-- Machining direction -->
  <line x1="440" y1="30" x2="440" y2="80" stroke="#333333" stroke-width="2" marker-end="url(#arr4)"/>
  <text x="440" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">spindle: 3-axis, from above only</text>

  <!-- Divots note -->
  <circle cx="440" cy="300" r="3.5" fill="#333333"/>
  <line x1="440" y1="304" x2="470" y2="385" stroke="#333333" stroke-width="0.8"/>
  <text x="476" y="392" font-size="12" fill="#333333"><tspan font-weight="bold" fill="#003262">conical divots</tspan> mark attachment-hole locations (§7.1.7)</text>
</svg>
