<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Helvetica, Arial, sans-serif">
  <!-- CS-006 Fig 1: complete infusion setup, resin pot to pump, in section.
       The two rules people miss are drawn: the mesh break before the outlet
       and the resin trap between bag and pump. -->
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <pattern id="mesh6" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff"/>
      <path d="M0 4 H8 M4 0 V8" stroke="#7a7a7a" stroke-width="1"/>
    </pattern>
    <marker id="arr7" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#333333"/>
    </marker>
    <marker id="arr7s" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M9,0 L0,4 L9,8 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Mold -->
  <rect x="150" y="250" width="480" height="50" fill="#f2f2f2" stroke="#333333" stroke-width="2"/>
  <text x="390" y="282" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333333">sealed + released mold (CS-004)</text>

  <!-- Laminate -->
  <rect x="230" y="234" width="320" height="16" fill="#d9d9d9" stroke="#333333" stroke-width="1.2"/>
  <text x="390" y="246" text-anchor="middle" font-size="10.5" fill="#111111">dry stack per WO ply table</text>
  <!-- Peel ply -->
  <rect x="222" y="226" width="336" height="8" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <!-- Flow mesh with break -->
  <rect x="222" y="214" width="270" height="12" fill="url(#mesh6)" stroke="#333333" stroke-width="1"/>
  <!-- mesh break dimension -->
  <line x1="492" y1="220" x2="546" y2="220" stroke="#003262" stroke-width="1.2" marker-start="url(#arr7s)" marker-end="url(#arr7)"/>
  <line x1="492" y1="196" x2="492" y2="228" stroke="#003262" stroke-width="0.8"/>
  <line x1="546" y1="196" x2="546" y2="228" stroke="#003262" stroke-width="0.8"/>
  <text x="519" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#003262">mesh break 30–50 mm</text>
  <text x="519" y="174" text-anchor="middle" font-size="10" fill="#333333">slows the front, fights race-tracking</text>

  <!-- Bag -->
  <path d="M 168 252 Q 180 200 230 196 L 540 196 Q 600 200 612 252" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="390" y="150" text-anchor="middle" font-size="11" fill="#333333">VB160 bag, pleat at every corner + every 300–400 mm of curved perimeter</text>
  <!-- pleat marks -->
  <path d="M 280 196 l 8 -14 l 8 14" fill="none" stroke="#333333" stroke-width="1.2"/>
  <path d="M 470 196 l 8 -14 l 8 14" fill="none" stroke="#333333" stroke-width="1.2"/>

  <!-- Tacky tape -->
  <rect x="160" y="246" width="16" height="10" fill="#333333"/>
  <rect x="604" y="246" width="16" height="10" fill="#333333"/>
  <text x="40" y="290" font-size="10.5" fill="#333333">tacky tape, full perimeter:</text>
  <text x="40" y="303" font-size="10.5" fill="#333333">first place to hunt leaks (§7.4)</text>
  <line x1="122" y1="285" x2="162" y2="256" stroke="#333333" stroke-width="0.8"/>

  <!-- Inlet side -->
  <circle cx="212" cy="240" r="9" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="212" y="244" text-anchor="middle" font-size="9" fill="#333333">IN</text>
  <path d="M 212 231 Q 212 120 120 120 L 96 120" fill="none" stroke="#333333" stroke-width="2"/>
  <!-- clamp -->
  <rect x="150" y="106" width="10" height="24" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="155" y="98" text-anchor="middle" font-size="10.5" fill="#333333">clamp</text>
  <!-- resin pot -->
  <path d="M 60 120 L 60 190 L 120 190 L 120 120" fill="none" stroke="#333333" stroke-width="2"/>
  <rect x="64" y="150" width="52" height="36" fill="#d9d9d9"/>
  <text x="90" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">resin pot</text>
  <text x="90" y="226" text-anchor="middle" font-size="10" fill="#333333">braced; line end</text>
  <text x="90" y="238" text-anchor="middle" font-size="10" fill="#333333">fully submerged</text>
  <text x="90" y="252" text-anchor="middle" font-size="10" fill="#333333">(a slurping inlet</text>
  <text x="90" y="264" text-anchor="middle" font-size="10" fill="#333333">injects bubbles)</text>

  <!-- Spiral inlet on flange -->
  <text x="212" y="322" text-anchor="middle" font-size="10.5" fill="#333333">spiral feed on the</text>
  <text x="212" y="335" text-anchor="middle" font-size="10.5" fill="#333333">flange, not the part</text>

  <!-- Outlet side -->
  <circle cx="568" cy="240" r="9" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="568" y="244" text-anchor="middle" font-size="9" fill="#333333">OUT</text>
  <path d="M 568 231 Q 568 120 660 120 L 688 120" fill="none" stroke="#333333" stroke-width="2"/>

  <!-- Resin trap -->
  <rect x="688" y="90" width="80" height="80" rx="6" fill="#ffffff" stroke="#003262" stroke-width="3"/>
  <text x="728" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#003262">RESIN</text>
  <text x="728" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#003262">TRAP</text>
  <text x="728" y="156" text-anchor="middle" font-size="9.5" fill="#333333">catch pot</text>
  <text x="728" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#003262">mandatory: never</text>
  <text x="728" y="209" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#003262">bag → pump direct</text>

  <!-- Pump + gauge -->
  <path d="M 768 110 L 800 110" fill="none" stroke="#333333" stroke-width="2"/>
  <rect x="800" y="88" width="60" height="44" rx="4" fill="#d9d9d9" stroke="#333333" stroke-width="1.5"/>
  <text x="830" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">pump</text>
  <circle cx="805" cy="60" r="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <line x1="805" y1="60" x2="812" y2="50" stroke="#333333" stroke-width="1.5"/>
  <text x="805" y="34" text-anchor="middle" font-size="10.5" fill="#333333">gauge, inHg</text>

  <!-- Flow arrow + max travel -->
  <line x1="230" y1="368" x2="550" y2="368" stroke="#003262" stroke-width="2" marker-end="url(#arr7)"/>
  <text x="390" y="360" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#003262">resin travel inlet → outlet: ≤0.5 m, or plan multiple feeds on the WO</text>

  <!-- Numbers strip -->
  <rect x="60" y="396" width="760" height="48" fill="#f2f2f2" stroke="#333333" stroke-width="1"/>
  <text x="440" y="416" text-anchor="middle" font-size="12" fill="#111111"><tspan font-weight="bold">Before resin:</tspan> pull to ≥27 inHg, then isolate the pump. Drop test ≤1 inHg over 10 min (§7.4).</text>
  <text x="440" y="434" text-anchor="middle" font-size="12" fill="#111111"><tspan font-weight="bold">Mix:</tspan> IN2 : AT30 = 100 : 30 by weight; mass ≈ (dry fiber × 0.65) × 1.2–1.3 (§7.5).</text>
</svg>
